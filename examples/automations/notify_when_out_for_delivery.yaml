# Notify when an Österreichische Post parcel goes out for delivery.

alias: "Österreichische Post: out for delivery"
description: Notify when a tracked Österreichische Post parcel is loaded for delivery today.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: oesterreichische_post_parcel_status_changed
    event_data:
      new_status: out_for_delivery

actions:
  - action: notify.mobile_app
    data:
      title: "Österreichische Post on the way"
      message: >-
        {{ trigger.event.data.sender or trigger.event.data.barcode }}
        is being delivered today.
      data:
        clickAction: "{{ trigger.event.data.url }}"
